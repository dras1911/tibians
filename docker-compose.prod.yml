# Docker Compose — Tibians PRODUCTION stack (plan T71 + T77, arch §3.3)
#
# 5 serwisów: caddy (SSL+proxy) ← web (Next.js) + scraper (worker)
#             + db (PostgreSQL) + tibiadata (self-host API, R11)
#
# Uruchomienie:
#   cp .env.production.example .env.production   # uzupełnij sekrety
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Dev stack (bez Caddy/web/scraper) → docker-compose.yml + docker-compose.override.yml

name: tibians-prod

services:
  # ─── Reverse proxy + SSL (front, jedyny serwis z portami publicznymi) ────
  caddy:
    image: caddy:2-alpine
    container_name: tibians-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN jest wymagany (np. tibians.tools)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL jest wymagany (Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certyfikaty Let's Encrypt (persistent!)
      - caddy-config:/config
    networks:
      - tibians-net
    depends_on:
      web:
        condition: service_healthy
      tibiadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.tibians.service=caddy"

  # ─── Next.js 15 app (tylko sieć wewnętrzna) ──────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: tibians-web:latest
    container_name: tibians-web
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TIBIADATA_BASE_URL: http://tibiadata:8080 # self-host (§18.1)
    networks:
      - tibians-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      - "com.tibians.service=web"

  # ─── Scraper worker (3 pętle, brak portów) ───────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    image: tibians-scraper:latest
    container_name: tibians-scraper
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TIBIADATA_BASE_URL: http://tibiadata:8080
      # Transport przez przeglądarkę (Cloudflare!): CloakBrowser + WARP.
      # Fallback: FlareSolverr (profil `fallback` — patrz niżej).
      SCRAPER_FETCH_MODE: browser
      SCRAPER_BROWSER_FETCH_URL: http://host.docker.internal:8192/v1
      SCRAPER_BROWSER_FETCH_TOKEN: ${BROWSER_FETCH_TOKEN:-}
      SCRAPER_BROWSER_FETCH_FALLBACK_URL: http://host.docker.internal:8191/v1
      SCRAPER_FETCH_TIMEOUT_MS: "60000"
    # Dostęp do serwisów w host network (browser-fetch :8192, flaresolverr :8191).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tibians-net
    depends_on:
      db:
        condition: service_healthy
      tibiadata:
        condition: service_healthy
      browser:
        condition: service_healthy
    stop_grace_period: 30s # graceful shutdown scheduler'a (T36)
    logging: *default-logging
    labels:
      - "com.tibians.service=scraper"

  # ─── browser-fetch: CloakBrowser + WARP (render stron za Cloudflare) ─────
  #
  # DLACZEGO host network:
  #   (a) dostęp do lokalnego proxy WARP (127.0.0.1:40000 — bind localhost),
  #   (b) scraper (w bridge) łączy się przez host.docker.internal:8192.
  #
  # BEZPIECZEŃSTWO: port 8192 nie może być publiczny. Chronimy na dwa sposoby:
  #   1. ufw: allow from 172.16.0.0/12 (sieci dockerowe), reszta DROP
  #      (jednorazowa konfiguracja — patrz DEPLOYMENT.md §WARP/browser),
  #   2. opcjonalny token `BROWSER_FETCH_TOKEN` (nagłówek X-BF-Token).
  browser:
    image: cloakhq/cloakbrowser:latest
    container_name: tibians-browser
    restart: unless-stopped
    network_mode: host
    environment:
      BF_BIND: 0.0.0.0
      BF_PORT: "8192"
      CB_PROXY: socks5://127.0.0.1:40000
      BF_TOKEN: ${BROWSER_FETCH_TOKEN:-}
      BF_HEADLESS: "1"
    volumes:
      - ./services/browser-fetch:/service:ro
    command: ["python", "/service/server.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8192/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s # pierwszy start = init Chromium (wolno na małym VPS)
    logging: *default-logging
    labels:
      - "com.tibians.service=browser"

  # ─── FlareSolverr: FALLBACK transportu (profil `fallback`) ───────────────
  #
  # Domyślnie NIE startuje (oszczędność ~700 MB RAM). Włącz gdy CloakBrowser
  # ma problem:  docker compose --profile fallback up -d flaresolverr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: tibians-flaresolverr
    restart: unless-stopped
    network_mode: host
    profiles: ["fallback"]
    environment:
      LOG_LEVEL: info
      PROXY_URL: socks5://127.0.0.1:40000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    labels:
      - "com.tibians.service=flaresolverr"

  # ─── PostgreSQL 17 ───────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: tibians-db
    restart: unless-stopped
    # Port TYLKO na localhost VPS — dla tunelu SSH (MCP Hermesa).
    # Nie wystawiamy bazy do świata (UFW blokuje zewnętrzne wejścia).
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tibians}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD jest wymagane}
      POSTGRES_DB: ${POSTGRES_DB:-tibians}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tibians-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tibians} -d ${POSTGRES_DB:-tibians}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    labels:
      - "com.tibians.service=db"

  # ─── TibiaData API (self-host, MIT — §18.1, R11 cache przez Caddy) ───────
  tibiadata:
    image: ghcr.io/tibiadata/tibiadata-api-go:latest
    container_name: tibians-tibiadata
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TIBIADATA_HOST: ${DOMAIN:-tibians.tools}
    networks:
      - tibians-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    labels:
      - "com.tibians.service=tibiadata"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  tibians-net:
    driver: bridge
